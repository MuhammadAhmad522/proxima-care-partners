name: Sync Fork with Upstream

on:
  schedule:
    # Poll upstream every 30 minutes; the sync step is skipped when already up to date
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Sync main with upstream
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/E3zz/proxima-care-partners.git
          git fetch upstream

          # Skip if fork is already up to date with upstream
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          if [ "$BEHIND" -eq 0 ]; then
            echo "Already up to date with upstream. Nothing to sync."
            exit 0
          fi

          echo "Fork is $BEHIND commit(s) behind upstream. Syncing..."

          if ! git merge upstream/main --no-edit; then
            echo "::error::Merge conflict detected while syncing with upstream." \
              "Please resolve conflicts manually and push to main."
            git merge --abort
            exit 1
          fi

          git push origin main
